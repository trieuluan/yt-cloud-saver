name: Release Desktop & Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome Extension
        run: |
          mkdir -p dist
          (cd extension && zip -r ../dist/yt-cloud-saver-extension.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/yt-cloud-saver-extension.zip

  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'YT Cloud Saver ${{ github.ref_name }}'
          releaseBody: 'Download the Desktop installer for your OS and yt-cloud-saver-extension.zip.'
          releaseDraft: true
          prerelease: false
