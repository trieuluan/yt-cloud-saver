name: Release Desktop & Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Draft Release with Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          printf "%s\n\n---\nDownload the Desktop installer for your OS and \`yt-cloud-saver-extension.zip\`.\n" "$NOTES" > notes.md
          gh release create "${{ github.ref_name }}" --draft --title "YT Cloud Saver ${{ github.ref_name }}" --notes-file notes.md || gh release edit "${{ github.ref_name }}" --notes-file notes.md

  package-extension:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome Extension & Update Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          (cd extension && zip -r ../dist/yt-cloud-saver-extension.zip .)
          gh release upload "${{ github.ref_name }}" dist/yt-cloud-saver-extension.zip --clobber
          gh release edit "${{ github.ref_name }}" --draft=false

  build-desktop:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''
          - platform: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'YT Cloud Saver ${{ github.ref_name }}'
          releaseBody: 'Download the Desktop installer for your OS and yt-cloud-saver-extension.zip.'
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
